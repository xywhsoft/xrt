      - name: Verify baseline compiler
        run: gcc --version

      - name: Run baseline module and single-header tests
        run: >-
          python3 tools/build.py
          --compiler gcc
          --suite core,string,net_socket
          --no-examples
          --jobs 4

      - name: Verify baseline trimming and static package
        run: |
          python3 tools/build.py --compiler gcc --suite core,string,net_socket --trim-only --no-examples
          python3 tools/package.py --compiler gcc --suite core,string,net_socket --kind static --verify

  tcc:
    name: TCC 0.9.27 basic
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
