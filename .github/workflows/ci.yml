  mail-and-acme-windows:
    name: Mail and ACME / Windows / ${{ matrix.product }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: xmail
            test_suite: xmail_tests
          - product: xpop3
            test_suite: xpop3_tests
          - product: xsmtp
            test_suite: xsmtp_tests
          - product: ximap
            test_suite: ximap_tests
          - product: xacme
            test_suite: xacme_tests
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Run extension tests and examples
        shell: msys2 {0}
        run: >-
          python tools/build.py --compiler gcc
          --manifest extlibs/${{ matrix.product }}/config/modules.json
          --suite ${{ matrix.test_suite }} --jobs 4

      - name: Build and run mail client examples
        if: matrix.product == 'xpop3' || matrix.product == 'xsmtp' || matrix.product == 'ximap'
        shell: msys2 {0}
        run: |
          if [ "${{ matrix.product }}" = xpop3 ]; then suite=pop3_client_example; fi
          if [ "${{ matrix.product }}" = xsmtp ]; then suite=smtp_submit_example; fi
          if [ "${{ matrix.product }}" = ximap ]; then suite=imap_client_example; fi
          python tools/build.py --compiler gcc --manifest extlibs/${{ matrix.product }}/config/modules.json --suite "$suite" --no-single --exclude-test '*' --jobs 4

      - name: Verify mail clients against an independent TLS server
        if: matrix.product == 'xmail'
        shell: msys2 {0}
        run: |
          set -e
          pacman --noconfirm --needed -S mingw-w64-ucrt-x86_64-openssl
          python tools/test_mail_tls_interop.py --rejection-policy

      - name: Verify MIME example output bytes and failed sinks on Windows
        if: matrix.product == 'xmail'
        shell: msys2 {0}
        run: python tools/test_mail_example_output.py

      - name: Run offline POP3 client example
        if: matrix.product == 'xpop3'
        shell: msys2 {0}
        run: python tools/build.py --compiler gcc --manifest extlibs/xpop3/config/modules.json --suite pop3_offline_example --no-single --jobs 4

      - name: Run offline SMTP submission example
        if: matrix.product == 'xsmtp'
        shell: msys2 {0}
        run: python tools/build.py --compiler gcc --manifest extlibs/xsmtp/config/modules.json --suite smtp_offline_example --no-single --jobs 4

      - name: Run offline IMAP client example
        if: matrix.product == 'ximap'
        shell: msys2 {0}
        run: python tools/build.py --compiler gcc --manifest extlibs/ximap/config/modules.json --suite imap_offline_example --no-single --jobs 4

      - name: Run xacme cross-process rotation
        if: matrix.product == 'xacme'
        shell: msys2 {0}
        run: python tools/test_acme_store_processes.py

      - name: Check xacme partial HTTP responses
        if: matrix.product == 'xacme'
        shell: msys2 {0}
        run: python tools/test_acme_http_faults.py

      - name: Verify xacme HTTP, TLS, DNS and lifecycle boundaries on Windows
        if: matrix.product == 'xacme'
        shell: msys2 {0}
        run: |
          pacman --noconfirm --needed -S mingw-w64-ucrt-x86_64-openssl
          python tools/test_acme_http_interop.py

      - name: Execute registered ACME public example on Windows
        if: matrix.product == 'xacme'
        shell: msys2 {0}
        run: |
          python -m pip install --disable-pip-version-check 'cryptography>=42'
          python -m unittest tools.test_acme_grant_verifier -v
          python tools/test_acme_examples.py
          python tools/test_acme_examples.py --single

      - name: Check xacme offline pruning
        if: matrix.product == 'xacme'
        shell: msys2 {0}
        run: python -m unittest tools.test_prune_acme_store -v

  gcc-baseline:
    name: GCC 12 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: gcc:12
    steps:
