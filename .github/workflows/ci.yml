name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    name: Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run build tooling tests
        run: >-
          python -m unittest
          tools/test_clean.py
          tools/test_build.py
          tools/test_declaration_features.py
          tools/test_extension_single.py
          tools/test_extension_layout.py
          tools/test_package.py
          tools/test_measure_size.py
          tools/test_measure_performance.py
          tools/test_api_docs.py
          tools/test_api_reference.py
          tools/test_example_index.py
          tools/test_release_status.py
          tools/test_release_maturity.py
          tools/test_scope.py
          tools/test_public_abi.py

      - name: Verify repository release maturity
        run: python tools/check_release_maturity.py

      - name: Verify API reference detail gates (G1-G5)
        run: python tools/check_api_reference_detail.py --all

      - name: Verify doc deep audits (ghosts/tables/rows/headings)
        run: python tools/doc_audit.py --all

      - name: Verify book chapter gates (docs/book)
        run: |
          python tools/generate_book_ci_references.py
          python tools/check_book.py --repo . --wwwroot out/doc-site check

      - name: Verify i18n translation gates (docs/book en/ru)
        run: |
          python tools/check_i18n.py selftest
          python tools/check_i18n.py check

      - name: Verify WebSocket API documentation
        run: >-
          python tools/check_api_docs.py
          --module-prefix websocket
          --function-prefix xrtWs
          --constant-prefix XWS_
          --type-prefix xws

      - name: Verify network API documentation
        run: >-
          python tools/check_api_docs.py
          --module-prefix net
          --function-prefix xrtNet
          --constant-prefix XNET_
          --type-prefix xnet

      - name: Verify HTTP API documentation
        run: >-
          python tools/check_api_docs.py
          --module-prefix http
          --function-prefix xrtHttp
          --constant-prefix XHTTP_
          --type-prefix xhttp

      - name: Verify Regex API documentation
        run: >-
          python tools/check_api_docs.py
          --module-prefix regex
          --function-prefix xrtRegex
          --constant-prefix XREGEX_
          --type-prefix xregex

      - name: Verify Value API documentation
        run: >-
          python tools/check_api_docs.py
          --module-prefix value
          --function-prefix xrtValue
          --constant-prefix XVALUE_
          --type-prefix xvalue

      - name: Verify Future API documentation
        run: |
          python tools/check_api_docs.py --module-prefix future --function-prefix xrtFuture --constant-prefix XFUTURE_ --type-prefix xfuture
          python tools/check_api_docs.py --module-prefix future --function-prefix xrtPromise --constant-prefix XPROMISE_ --type-prefix xpromise

      - name: Verify task API documentation
        run: >-
          python tools/check_api_docs.py
          --module-prefix task
          --function-prefix xrtTask
          --constant-prefix XRT_TASK_
          --type-prefix xtask

      - name: Verify coroutine API documentation
        run: >-
          python tools/check_api_docs.py
          --module-prefix coroutine
          --function-prefix xrtCo
          --constant-prefix XRT_CO
          --type-prefix xco

      - name: Verify generated features
        run: |
          python tools/generate_features.py --check
          python tools/amalgamate.py --all --check
          python tools/generate_api_reference.py --check
          python tools/generate_example_index.py --check

  extension-metadata:
    name: Metadata / ${{ matrix.product }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        product:
          - xruntime
          - xhttp
          - xws
          - xmail
          - xsmtp
          - xpop3
          - ximap
          - xssh
          - xacme
          - xllm
          - xllm-session
          - xwork
          - xjwt
          - xoauth2
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify extension metadata and generated assets
        run: |
          manifest="extlibs/${{ matrix.product }}/config/modules.json"
          python tools/generate_extension_features.py --check "${manifest}"
          python tools/amalgamate.py --manifest "${manifest}" --check
          python tools/generate_api_reference.py --manifest "${manifest}" --check
          python tools/check_api_docs.py --manifest "${manifest}"
          python tools/check_release_maturity.py --release --manifest "${manifest}"

  extensions:
    name: Extension / ${{ matrix.product }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: xruntime
            test_suite: xruntime_tests
            package_suite: xruntime
          - product: xhttp
            test_suite: xhttp_tests
            package_suite: xhttp
          - product: xws
            test_suite: xws_tests
            package_suite: xws
          - product: xmail
            test_suite: xmail_tests
            package_suite: xmail
            tls_fault_suite: mail_net_tls_close_fault_tests
            tls_fault_test: test_mail_net_tls_close_fault
            min_line_coverage: 73
            min_branch_coverage: 59
          - product: xsmtp
            test_suite: xsmtp_tests
            package_suite: xsmtp
            tls_fault_suite: smtp_upload_tls_fault_runtime_tests
            tls_fault_test: test_smtp_upload_tls_fault_runtime
            min_line_coverage: 75
            min_branch_coverage: 56
          - product: xpop3
            test_suite: xpop3_tests
            package_suite: xpop3
            tls_fault_suite: pop3_read_tls_fault_runtime_tests
            tls_fault_test: test_pop3_read_tls_fault_runtime
            min_line_coverage: 72
            min_branch_coverage: 55
          - product: ximap
            test_suite: ximap_tests
            package_suite: ximap
            tls_fault_suite: imap_append_tls_fault_runtime_tests
            tls_fault_test: test_imap_append_tls_fault_runtime
            min_line_coverage: 74
            min_branch_coverage: 55
          - product: xssh
            test_suite: xssh
            package_suite: xssh
          - product: xacme
            test_suite: xacme_tests
            package_suite: xacme
          - product: xllm
            test_suite: xllm
            package_suite: xllm
          - product: xllm-session
            test_suite: xllm_session
            package_suite: xllm_session
          - product: xwork
            test_suite: xwork
            package_suite: xwork
          - product: xjwt
            test_suite: xjwt,xjwt_tests
            package_suite: xjwt
          - product: xoauth2
            test_suite: xoauth2,xoauth2_tests,xoauth2_oidc
            package_suite: xoauth2
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run HTTP client retirement contract first
        if: matrix.product == 'xhttp'
        run: >-
          python tools/build.py
          --compiler gcc
          --manifest extlibs/xhttp/config/modules.json
          --suite http_client
          --test test_http_client_contract
          --no-single
          --jobs 4

      - name: Run extension tests
        # GitHub 托管 runner 通过 seccomp 禁用了 io_uring（EPERM），
        # uring 运行时证据由自托管环境承担；此处保留其余全部运行证据。
        run: >-
          python tools/build.py
          --compiler gcc
          --manifest extlibs/${{ matrix.product }}/config/modules.json
          --suite ${{ matrix.test_suite }}
          --exclude-test *uring*
          --exclude-single-test *uring*
          --jobs 4

      - name: Verify mail coverage input provenance
        if: matrix.product == 'xmail' || matrix.product == 'xpop3' || matrix.product == 'xsmtp' || matrix.product == 'ximap'
        run: |
          python tools/test_gcov_coverage.py
          python tools/test_mail_coverage_inputs.py
          python tools/test_mail_header_coverage.py

      - name: Measure mail extension coverage
        if: matrix.product == 'xmail' || matrix.product == 'xpop3' || matrix.product == 'xsmtp' || matrix.product == 'ximap'
        run: >-
          python tools/measure_mail_coverage.py
          --product ${{ matrix.product }}
          --min-lines ${{ matrix.min_line_coverage }}
          --min-branches ${{ matrix.min_branch_coverage }}

      - name: Verify saved mail coverage provenance
        if: matrix.product == 'xmail' || matrix.product == 'xpop3' || matrix.product == 'xsmtp' || matrix.product == 'ximap'
        run: python tools/measure_mail_coverage.py --product ${{ matrix.product }} --report-only

      - name: Measure and verify private mail header functions
        if: matrix.product == 'xmail' || matrix.product == 'xpop3' || matrix.product == 'xsmtp' || matrix.product == 'ximap'
        run: |
          python tools/measure_mail_header_coverage.py --product ${{ matrix.product }}
          python tools/measure_mail_header_coverage.py --product ${{ matrix.product }} --report-only

      - name: Upload mail coverage report
        if: matrix.product == 'xmail' || matrix.product == 'xpop3' || matrix.product == 'xsmtp' || matrix.product == 'ximap'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mail-coverage-linux-${{ matrix.product }}
          path: |
            out/mail/coverage/linux/${{ matrix.product }}/coverage.json
            out/mail/coverage/linux/${{ matrix.product }}/header-functions.json
            out/gcc/native-linux/${{ matrix.test_suite }}/obj/extlibs__${{ matrix.product }}__src__*.gcno
            out/gcc/native-linux/${{ matrix.test_suite }}/obj/extlibs__${{ matrix.product }}__src__*.gcda
            out/mail/tls-coverage/linux/${{ matrix.product }}/execution.json
            out/gcc/native-linux/*example,${{ matrix.product }}/obj/extlibs__${{ matrix.product }}__src__*.gcno
            out/gcc/native-linux/*example,${{ matrix.product }}/obj/extlibs__${{ matrix.product }}__src__*.gcda
            out/gcc/native-linux/*example,${{ matrix.product }}/examples_*
          if-no-files-found: error

      - name: Sanitize untrusted MIME parsing
        if: matrix.product == 'xmail'
        run: >-
          python tools/build.py
          --compiler gcc
          --manifest extlibs/xmail/config/modules.json
          --suite xmail_tests
          --test test_mail_tree_adversarial
          --no-single
          --jobs 4
          --cflag=-Werror
          --cflag=-fno-omit-frame-pointer
          --cflag=-fsanitize=address,undefined
          --ldflag=-fsanitize=address,undefined

      - name: Sanitize mail TLS protocol failures
        if: matrix.product == 'xmail' || matrix.product == 'ximap' || matrix.product == 'xsmtp' || matrix.product == 'xpop3'
        run: >-
          python tools/build.py
          --compiler gcc
          --manifest extlibs/${{ matrix.product }}/config/modules.json
          --suite ${{ matrix.tls_fault_suite }}
          --test ${{ matrix.tls_fault_test }}
          --no-single
          --no-examples
          --jobs 4
          --cflag=-O1
          --cflag=-g
          --cflag=-fno-omit-frame-pointer
          --cflag=-fsanitize=address,undefined
          --ldflag=-fsanitize=address,undefined

      - name: Sanitize mail example retirement
        if: matrix.product == 'xmail'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          python tools/build.py
          --compiler clang
          --manifest extlibs/xmail/config/modules.json
          --suite mail_net_tls_close_fault_tests
          --test test_mail_example_cleanup
          --no-single
          --no-examples
          --jobs 4
          --cflag=-O1
          --cflag=-g
          --cflag=-fno-omit-frame-pointer
          --cflag=-fsanitize=address,undefined
          --ldflag=-fsanitize=address,undefined

      - name: Sanitize compressed IMAP failures and streaming uploads
        if: matrix.product == 'ximap'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          python tools/build.py
          --compiler clang
          --manifest extlibs/ximap/config/modules.json
          --suite imap_compress_fault_runtime_tests
          --no-examples
          --jobs 4
          --cflag=-std=c11
          --cflag=-D_GNU_SOURCE=
          --cflag=-O1
          --cflag=-g
          --cflag=-fno-omit-frame-pointer
          --cflag=-fsanitize=address,undefined
          --ldflag=-fsanitize=address,undefined

      - name: Sanitize IMAP data and BODYSTRUCTURE diagnostics and borrowed outputs
        if: matrix.product == 'ximap'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          python tools/build.py
          --compiler clang
          --manifest extlibs/ximap/config/modules.json
          --suite imap_data,imap_data_error_tests,imap_body,imap_body_error_tests
          --no-examples
          --jobs 4
          --cflag=-std=c11
          --cflag=-D_GNU_SOURCE=
          --cflag=-O1
          --cflag=-g
          --cflag=-fno-omit-frame-pointer
          --cflag=-fsanitize=address,undefined
          --ldflag=-fsanitize=address,undefined

      - name: Sanitize ACME DNS, flow, storage and directory diagnostics
        if: matrix.product == 'xacme'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          python tools/build.py
          --compiler clang
          --manifest extlibs/xacme/config/modules.json
          --suite acme_store,acme_store_diagnostic_tests,acme_flow_fault_tests,acme_dns_fault_tests,dir_create_diagnostic_tests
          --no-examples
          --jobs 4
          --cflag=-std=c11
          --cflag=-D_GNU_SOURCE=
          --cflag=-O1
          --cflag=-g
          --cflag=-fno-omit-frame-pointer
          --cflag=-fsanitize=address,undefined
          --ldflag=-fsanitize=address,undefined

      - name: Verify IMAP interoperability input and artifact regressions
        if: matrix.product == 'ximap'
        run: python tools/test_imap_compress_interop_inputs.py

      - name: Verify IMAP compression against independent zlib and TLS
        if: matrix.product == 'ximap'
        run: |
          python tools/test_imap_compress_interop.py
          python tools/test_imap_compress_interop.py --compiler clang --sanitize

      - name: Verify POP3 SMTP and IMAP against an independent TLS server
        if: matrix.product == 'xmail'
        run: python tools/test_mail_tls_interop.py --rejection-policy

      - name: Verify MIME example output bytes and failed sinks
        if: matrix.product == 'xmail'
        run: python tools/test_mail_example_output.py

      - name: Run xacme cross-process rotation
        if: matrix.product == 'xacme'
        run: python tools/test_acme_store_processes.py

      - name: Check xacme partial HTTP responses
        if: matrix.product == 'xacme'
        run: python tools/test_acme_http_faults.py

      - name: Verify xacme HTTP, TLS, DNS and lifecycle boundaries
        if: matrix.product == 'xacme'
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: python tools/test_acme_http_interop.py --sanitize

      - name: Execute registered ACME public example
        if: matrix.product == 'xacme'
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          python -m pip install --disable-pip-version-check 'cryptography>=42'
          python -m unittest tools.test_acme_grant_verifier -v
          python tools/test_acme_examples.py
          python tools/test_acme_examples.py --single --sanitize

      - name: Check xacme offline pruning
        if: matrix.product == 'xacme'
        run: python -m unittest tools.test_prune_acme_store -v

      - name: Verify extension trimming
        run: >-
          python tools/build.py
          --compiler gcc
          --manifest extlibs/${{ matrix.product }}/config/modules.json
          --suite ${{ matrix.package_suite }}
          --trim-only

      - name: Build and run mail client examples
        if: matrix.product == 'xpop3' || matrix.product == 'xsmtp' || matrix.product == 'ximap'
        run: |
          if [ "${{ matrix.product }}" = xpop3 ]; then suite=pop3_client_example; fi
          if [ "${{ matrix.product }}" = xsmtp ]; then suite=smtp_submit_example; fi
          if [ "${{ matrix.product }}" = ximap ]; then suite=imap_client_example; fi
          python tools/build.py --compiler gcc --manifest extlibs/${{ matrix.product }}/config/modules.json --suite "$suite" --no-single --exclude-test '*' --jobs 4

      - name: Run offline POP3 client example
        if: matrix.product == 'xpop3'
        run: python tools/build.py --compiler gcc --manifest extlibs/xpop3/config/modules.json --suite pop3_offline_example --no-single --jobs 4

      - name: Run offline SMTP submission example
        if: matrix.product == 'xsmtp'
        run: python tools/build.py --compiler gcc --manifest extlibs/xsmtp/config/modules.json --suite smtp_offline_example --no-single --jobs 4

      - name: Run offline IMAP client example
        if: matrix.product == 'ximap'
        run: python tools/build.py --compiler gcc --manifest extlibs/ximap/config/modules.json --suite imap_offline_example --no-single --jobs 4

      - name: Run xacme mock CA end-to-end verification
        if: matrix.product == 'xacme'
        run: |
          python -m pip install --disable-pip-version-check cryptography
          python -m unittest tools.test_acme_mock -v

      - name: Verify extension packages
        run: |
          python tools/package.py --compiler gcc --manifest extlibs/${{ matrix.product }}/config/modules.json --suite ${{ matrix.package_suite }} --kind static --verify
          python tools/package.py --compiler gcc --manifest extlibs/${{ matrix.product }}/config/modules.json --suite ${{ matrix.package_suite }} --kind shared --verify

  auth-extensions:
    name: JWT and OAuth2 / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Install independent ID token fixture signer
        run: python -m pip install cryptography==46.0.5

      - name: Verify OIDC login and refresh application policy
        if: runner.os != 'Windows'
        run: python tools/test_oidc_example_policy.py --output-dir out/auth_extensions/oidc-policy/normal

      - name: Sanitize OIDC application policy
        if: runner.os != 'Windows'
        run: python tools/test_oidc_example_policy.py --compiler clang --sanitize --output-dir out/auth_extensions/oidc-policy/sanitize

      - name: Verify OIDC application policy on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python tools/test_oidc_example_policy.py --output-dir out/auth_extensions/oidc-policy/normal

      - name: Upload OIDC policy results and fixture logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oidc-policy-${{ matrix.runner }}
          path: out/auth_extensions/oidc-policy/
          if-no-files-found: error

      - name: Run JWT and OAuth2 tests and examples
        if: runner.os != 'Windows'
        run: python tools/test_auth_extensions.py

      - name: Sanitize JWT and OAuth2 tests
        if: runner.os != 'Windows'
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: python tools/test_auth_extensions.py --case jwt --case oauth2 --case oauth2_flow_fault --case oauth2_http_fault --case jwt_example_fault --case oauth2_example_fault --case oidc_example_fault --sanitize

      # Ubuntu 24.04's OpenSSL 3.0 cannot decode RFC 5958's publicKey field.
      # Keep the independent v2 import/sign/verify gate with a pinned oracle.
      - name: Build RFC 5958 capable OpenSSL oracle
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          archive="$RUNNER_TEMP/openssl-3.5.5.tar.gz"
          curl --fail --location --retry 3 https://github.com/openssl/openssl/releases/download/openssl-3.5.5/openssl-3.5.5.tar.gz --output "$archive"
          echo "b28c91532a8b65a1f983b4c28b7488174e4a01008e29ce8e69bd789f28bc2a89  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/openssl-3.5.5"
          ./Configure --prefix="$RUNNER_TEMP/openssl-oracle" no-shared no-tests
          make -j2 build_sw
          make install_sw
          echo "$RUNNER_TEMP/openssl-oracle/bin" >> "$GITHUB_PATH"

      - name: Verify RFC 5958 RSA/EC OpenSSL interoperability
        if: runner.os != 'Windows'
        run: python extlibs/xjwt/tests/test_rfc5958_openssl.py

      - name: Verify OAuth2 HTTP/TLS against independent servers
        if: runner.os != 'Windows'
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: python tools/test_oauth2_tls_interop.py --sanitize

      - name: Check JWT and unified OAuth2 line and branch coverage
        if: runner.os != 'Windows'
        run: |
          python tools/test_gcov_coverage.py
          python tools/test_auth_coverage_inputs.py
          python tools/measure_auth_coverage.py
          python tools/test_extension_header_coverage.py
          python tools/measure_extension_header_coverage.py --product xjwt
          python tools/measure_extension_header_coverage.py --product xoauth2
          python tools/measure_extension_header_coverage.py --product xjwt --report-only
          python tools/measure_extension_header_coverage.py --product xoauth2 --report-only

      - name: Run JWT and OAuth2 tests and examples on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python tools/test_auth_extensions.py

      - name: Verify auth static and shared consumers
        if: runner.os != 'Windows'
        run: python tools/test_auth_package.py

      - name: Verify auth static and shared consumers on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: python tools/test_auth_package.py

      - name: Upload authentication delivery artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: auth-delivery-${{ matrix.runner }}
          path: out/auth_extensions/package/
          if-no-files-found: error

      - name: Verify OAuth2 HTTP/TLS against independent servers on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          pacman --noconfirm --needed -S mingw-w64-ucrt-x86_64-openssl
          python tools/test_oauth2_tls_interop.py

      - name: Check JWT and unified OAuth2 coverage on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          python tools/test_gcov_coverage.py
          python tools/test_auth_coverage_inputs.py
          python tools/measure_auth_coverage.py
          python tools/test_extension_header_coverage.py
          python tools/measure_extension_header_coverage.py --product xjwt
          python tools/measure_extension_header_coverage.py --product xoauth2
          python tools/measure_extension_header_coverage.py --product xjwt --report-only
          python tools/measure_extension_header_coverage.py --product xoauth2 --report-only

      - name: Upload authentication coverage reports
