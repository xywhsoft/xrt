          clang-18 --version

      - name: Run Clang module and single-header tests
        run: >-
          python tools/build.py
          --compiler clang-18
          --suite core,string,net_socket
          --no-examples
          --jobs 4

      - name: Verify Clang trimming and packages
        run: |
          python tools/build.py --compiler clang-18 --suite core,string,net_socket --trim-only --no-examples
          python tools/package.py --compiler clang-18 --suite core,string,net_socket --kind static --verify
          python tools/package.py --compiler clang-18 --suite core,string,net_socket --kind shared --verify

  native:
    name: Platform / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            runner: ubuntu-latest
            compiler: gcc
          - name: macOS Apple Clang
            runner: macos-latest
            compiler: clang
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run module and single-header tests
        # GitHub 托管 runner 禁用 io_uring，排除 uring 运行时测试；
        # uring 编译证据由下方 io_uring 门禁的 --no-run 构建保留。
        if: matrix.runner == 'ubuntu-latest'
        run: >-
          python tools/build.py
          --compiler ${{ matrix.compiler }}
          --suite all
          --exclude-test *uring*
          --exclude-single-test *uring*
          --jobs 4

      - name: Run module and single-header tests
        if: matrix.runner != 'ubuntu-latest'
        run: python tools/build.py --compiler ${{ matrix.compiler }} --suite all --jobs 4

      - name: Build WebSocket extension runtime gates
        run: >-
          python tools/build.py
          --compiler ${{ matrix.compiler }}
          --manifest extlibs/xws/config/modules.json
          --suite xws_tests
          --no-single
          --jobs 4

      - name: Verify static and shared package consumers
        run: |
          python tools/package.py --compiler ${{ matrix.compiler }} --suite all --kind static --verify
          python tools/package.py --compiler ${{ matrix.compiler }} --suite all --kind shared --verify

      - name: Run WebSocket interoperability gate
        run: >-
          python extlibs/xws/tools/test_websocket_interop.py
          --peer out/${{ matrix.compiler }}/native/xws_tests/test_interop_peer

      - name: Run WebSocket reconnect stress gate
        run: out/${{ matrix.compiler }}/native/xws_tests/test_http_reconnect 1000

      - name: Install TLS test certificate dependency
        run: python -m pip install cryptography==50.0.0

      - name: Run independent TLS and RSA regressions
        run: |
          python tools/test_tls_interop.py --compiler ${{ matrix.compiler }}
          python tools/test_rsa_blinding.py --compiler ${{ matrix.compiler }} --sizes 1024,2048,4096

      - name: Run protocol Clang fuzz gates
        if: matrix.runner == 'ubuntu-latest'
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: python tools/test_protocol_fuzz.py --runs 20000

      - name: Preserve protocol fuzz failure artifacts
        if: failure() && matrix.runner == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protocol-fuzz-failures
          path: out/fuzz/linux/*/artifacts/*
          if-no-files-found: ignore
          retention-days: 14

      - name: Run time arithmetic and diagnostic sanitizer gate
        if: matrix.runner == 'ubuntu-latest'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          python tools/build.py
          --compiler clang
          --suite time,time_text,time_error_oom_tests
          --no-examples
          --jobs 2
          --cflag=-O1
          --cflag=-g
          --cflag=-fsanitize=address,undefined
          --cflag=-fno-omit-frame-pointer
          --ldflag=-fsanitize=address,undefined

      - name: Run coroutine sanitizer gate
        if: matrix.runner == 'ubuntu-latest'
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          python tools/build.py
          --compiler clang
          --suite coroutine,coroutine_scheduler,coroutine_event
          --no-single
          --rebuild
          --cflag=-O1
          --cflag=-g
          --cflag=-fsanitize=address,undefined
          --cflag=-fno-omit-frame-pointer
          --cflag=-fcf-protection=full

      - name: Run core and coroutine thread sanitizer gate
        if: matrix.runner == 'ubuntu-latest'
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: >-
          python tools/build.py
          --compiler clang
          --suite core,memory_debug,memory_stats,coroutine,coroutine_scheduler,coroutine_event
          --no-single
          --rebuild
          --cflag=-O1
          --cflag=-g
          --cflag=-fsanitize=thread
          --cflag=-fno-omit-frame-pointer

      - name: Run IMAP fault lifecycle with thread sanitizer
        if: matrix.runner == 'ubuntu-latest'
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: >-
          python tools/build.py
          --compiler clang
          --manifest extlibs/ximap/config/modules.json
          --suite ximap_tests
          --test test_imap_compress_fault_runtime
          --no-single
          --no-examples
          --cflag=-O1
          --cflag=-g
          --cflag=-fsanitize=thread
          --cflag=-fno-omit-frame-pointer

      - name: Run xacme extension sanitizer gate
        if: matrix.runner == 'ubuntu-latest'
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >-
          python tools/build.py
          --compiler clang
          --manifest extlibs/xacme/config/modules.json
          --suite xacme_tests
          --no-single
          --rebuild
          --cflag=-O1
          --cflag=-g
          --cflag=-fsanitize=address,undefined
          --cflag=-fno-omit-frame-pointer

      - name: Compile Linux io_uring network and TLS gates
        # GitHub 托管 runner 通过 seccomp 禁用 io_uring（EPERM），
        # 此步骤仅保留 uring 目标的编译与链接证据；
        # 运行证据需要在支持 io_uring 的环境（自托管 runner 或本机）执行。
        if: matrix.runner == 'ubuntu-latest'
        run: >-
          python tools/build.py
          --compiler gcc
          --manifest extlibs/xhttp/config/modules.json
          --suite
          net_port_uring,net_file,net_tcp_file_uring_tests,net_tcp_dial_uring_tests,net_tcp_dial_future_uring_tests,net_tcp_uring_tests,net_tcp_future_uring_tests,net_udp_uring_tests,net_udp_sync_uring_tests,net_udp_future_uring_tests,tls_stream_dial_future_uring_tests,tls_stream_dial_uring_tests,tls_stream_uring_tests,http_client_pool_uring_tests,http_client_stream_async_uring_tests,http_client_uring_tests,http_server_uring_tests,http_server_tls_uring_tests
          --no-run
          --rebuild
          --jobs 4

      - name: Verify trim dependencies
        run: python tools/build.py --compiler ${{ matrix.compiler }} --suite all --trim-only

  arm64-native:
    name: Linux ARM64 native
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify native ARMv8 AES and PMULL
        run: |
          set -eu
          test "$(uname -m)" = "aarch64"
          python tools/build.py \
            --compiler gcc \
            --suite crypto_aes,crypto_aes_gcm,tls_record_aes \
            --no-single \
            --rebuild \
            --cflag=-DXRT_TEST_REQUIRE_ARM_CRYPTO \
            --jobs 4

      - name: Verify AArch64 coroutine ABI and branch protection
        run: |
          set -eu
          python tools/build.py \
            --compiler gcc \
            --suite coroutine,coroutine_scheduler,coroutine_event \
            --no-single \
            --rebuild \
            --cflag=-mbranch-protection=standard \
            --jobs 4

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Run module and single-header tests
        run: python tools/build.py --compiler gcc --suite all --jobs 4

      - name: Build WebSocket extension runtime gates
        run: >-
          python tools/build.py
          --compiler gcc
          --manifest extlibs/xws/config/modules.json
          --suite xws_tests
          --no-single
          --jobs 4

      - name: Verify static and shared package consumers
        run: |
          python tools/package.py --compiler gcc --suite all --kind static --verify
          python tools/package.py --compiler gcc --suite all --kind shared --verify

      - name: Verify representative single-header size profiles
        run: python tools/measure_size.py --compiler gcc --arch x64 --kind single

      - name: Run current API performance smoke
        run: python tools/measure_performance.py --compiler gcc --arch x64 --smoke

      - name: Run WebSocket interoperability gate
        run: >-
          python extlibs/xws/tools/test_websocket_interop.py
          --peer out/gcc/native/xws_tests/test_interop_peer.exe

      - name: Run WebSocket reconnect stress gate
        run: |
          out/gcc/native/xws_tests/test_http_reconnect.exe 1000
          out/gcc/native/xws_tests/test_http_reconnect_iocp.exe 1000

      - name: Verify trim dependencies
        run: python tools/build.py --compiler gcc --suite all --trim-only

  windows-msvc:
    name: Windows ${{ matrix.compiler }} ${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - cl
          - clang-cl
        arch:
          - x64
          - x86
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup Visual C++ environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: ${{ matrix.arch }}

      - name: Verify compiler environment
        run: |
          $compiler = Get-Command ${{ matrix.compiler }} -ErrorAction Stop
          Write-Host $compiler.Source

      - name: Compile VC modular and single headers
        if: matrix.compiler == 'cl' && matrix.arch == 'x64'
        run: |
          New-Item -ItemType Directory -Force out/vc-smoke | Out-Null
          cl /nologo /TC /std:c11 /W4 /WX /c /Iinclude .github/fixtures/compiler_xrt_consumer.c /Foout/vc-smoke/modular.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /TC /std:c11 /W4 /WX /c /Isingle .github/fixtures/compiler_xrt_consumer.c /Foout/vc-smoke/single.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify all-feature static package
        run: >-
          python tools/package.py
          --compiler ${{ matrix.compiler }}
          --arch ${{ matrix.arch }}
          --suite all
          --kind static
          --verify

      - name: Verify all-feature shared package
        run: >-
          python tools/package.py
          --compiler ${{ matrix.compiler }}
          --arch ${{ matrix.arch }}
          --suite all
          --kind shared
          --verify

      - name: Upload linker diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linker-diagnostics-${{ matrix.compiler }}-${{ matrix.arch }}
          path: release/**/*.link.log
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@2817442ee7c3346c1eb7d2ec60263c93206ba14f # v1
        with:
          ndk-version: r27c

      - name: Build current core and network tests
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -eu
          mkdir -p .ci/bin
          cat > .ci/bin/android-cc <<'EOF'
          #!/bin/sh
          exec "$ANDROID_CC" "$@"
          EOF
          chmod +x .ci/bin/android-cc
          export ANDROID_CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
          export PATH="$PWD/.ci/bin:$PATH"
          python tools/build.py --compiler android-cc --target-platform android --suite core,net --no-run --jobs 4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android tests
        timeout-minutes: 10
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb shell "rm -rf /data/local/tmp/xrt-ci && mkdir -p /data/local/tmp/xrt-ci"
            adb push "out/android-cc/native-android/core,net/test_core" /data/local/tmp/xrt-ci/test_core
            adb push "out/android-cc/native-android/core,net/test_net" /data/local/tmp/xrt-ci/test_net
            adb push "out/android-cc/native-android/core,net/test_single" /data/local/tmp/xrt-ci/test_single
            adb push "out/android-cc/native-android/core,net/test_single_net" /data/local/tmp/xrt-ci/test_single_net
            adb shell "chmod 755 /data/local/tmp/xrt-ci/*"
            adb shell "cd /data/local/tmp/xrt-ci && ./test_core"
            adb shell "cd /data/local/tmp/xrt-ci && ./test_net"
            adb shell "cd /data/local/tmp/xrt-ci && ./test_single"
            adb shell "cd /data/local/tmp/xrt-ci && ./test_single_net"

  macos-arm64:
    name: macOS ARM64 coroutine ABI
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify Apple Silicon coroutine ABI
        run: |
          set -eu
          test "$(uname -m)" = "arm64"
          python tools/build.py \
            --compiler clang \
            --suite coroutine,coroutine_scheduler,coroutine_event \
            --no-single \
            --rebuild \
            --cflag=-mbranch-protection=standard \
            --jobs 4

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Build current core and network tests
        run: |
          set -eu
          mkdir -p .ci/bin
          cat > .ci/bin/ios-cc <<'EOF'
          #!/bin/sh
          exec xcrun clang \
            -target "$IOS_TARGET" \
            -isysroot "$IOS_SDKROOT" \
            -mios-simulator-version-min=13.0 \
            "$@"
          EOF
          chmod +x .ci/bin/ios-cc
          export IOS_SDKROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          export IOS_TARGET="$(uname -m)-apple-ios-simulator"
          export PATH="$PWD/.ci/bin:$PATH"
          python tools/build.py --compiler ios-cc --suite core,net --no-run --jobs 4

      - name: Run iOS Simulator tests
        run: |
          set -eu
          RUNTIME="$(xcrun simctl list runtimes --json | ruby -rjson -e 'r=JSON.parse(STDIN.read)["runtimes"].select { |x| x["isAvailable"] && x["identifier"].include?("iOS") }.last; abort("No available iOS runtime") unless r; puts r["identifier"]')"
          DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.iPhone-13"
          UDID="$(xcrun simctl create "XRT CI iPhone" "$DEVICE_TYPE" "$RUNTIME")"
          OUT="$PWD/out/ios-cc/native/core,net"
          cleanup() {
            xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true
            xcrun simctl delete "$UDID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" "$OUT/test_core"
          xcrun simctl spawn "$UDID" "$OUT/test_net"
          xcrun simctl spawn "$UDID" "$OUT/test_single"
          xcrun simctl spawn "$UDID" "$OUT/test_single_net"
