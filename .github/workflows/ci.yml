      - name: Install pinned TCC compatibility line
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tcc binutils
          tcc -v 2>&1 | tee /tmp/xrt-tcc-version.txt
          grep -F "tcc version 0.9.27" /tmp/xrt-tcc-version.txt

      - name: Run TCC module and single-header tests
        run: >-
          python tools/build.py
          --compiler tcc
          --suite core,string,net_socket
          --no-examples
          --jobs 4

      - name: Verify TCC trimming and static package
        run: |
          python tools/build.py --compiler tcc --suite core,string,net_socket --trim-only --no-examples
          python tools/package.py --compiler tcc --suite core,string,net_socket --kind static --verify

  clang:
    name: Clang 18 basic
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
