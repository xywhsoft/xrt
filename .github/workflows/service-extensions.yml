name: Service extensions (developing)

on:
  push:
    paths:
      - 'extlibs/xredis/**'
      - 'single/extlibs/xredis*'
      - 'extlibs/xcron/**'
      - 'single/extlibs/xcron*'
      - 'extlibs/xrpc/**'
      - 'single/extlibs/xrpc*'
      - 'extlibs/xmqtt/**'
      - 'single/extlibs/xmqtt*'
      - 'include/**'
      - 'src/**'
      - 'config/modules.json'
      - 'tools/**'
      - '.github/workflows/service-extensions.yml'
  pull_request:
    paths:
      - 'extlibs/xredis/**'
      - 'single/extlibs/xredis*'
      - 'extlibs/xcron/**'
      - 'single/extlibs/xcron*'
      - 'extlibs/xrpc/**'
      - 'single/extlibs/xrpc*'
      - 'extlibs/xmqtt/**'
      - 'single/extlibs/xmqtt*'
      - 'include/**'
      - 'src/**'
      - 'config/modules.json'
      - 'tools/**'
      - '.github/workflows/service-extensions.yml'
  workflow_dispatch:
    inputs:
      xcron_cohorts:
        description: Run the full native Linux xcron latency campaign
        type: boolean
        default: false
      xredis_hiredis:
        description: Sample native Linux Redis TCP and TLS against pinned Hiredis
        type: boolean
        default: false
      xmqtt_comparison:
        description: Sample native Linux MQTT against pinned Paho C and Mosquitto
        type: boolean
        default: false

permissions:
  contents: read

# Add the other products only when their first real modules exist. A normal
# asset audit is intentional: unfinished product roots must remain developing.
# This workflow is not a claim of production acceptance or pinned performance.
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: xredis
            examples: xredis_examples
          - product: xcron
            examples: xcron_examples
          - product: xrpc
            examples: xrpc_examples
          - product: xmqtt
            examples: xmqtt_examples
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check assets before any generator can repair them
        run: |
          python tools/check_release_maturity.py --manifest extlibs/${{ matrix.product }}/config/modules.json
          python tools/generate_extension_features.py extlibs/${{ matrix.product }}/config/modules.json --check
          python tools/amalgamate.py --manifest extlibs/${{ matrix.product }}/config/modules.json --check
          python tools/generate_api_reference.py --manifest extlibs/${{ matrix.product }}/config/modules.json --check
          python tools/check_api_docs.py --manifest extlibs/${{ matrix.product }}/config/modules.json
      - name: Build asset and public API inventory regression
        if: matrix.product == 'xredis'
        run: python -m unittest tools.test_build.AggregateAssetTest tools.test_api_docs tools.test_api_reference tools.test_extension_layout
      - name: Shared JSON scanner and reader regression
        if: matrix.product == 'xredis'
        run: |
          python tools/check_api_docs.py --module-prefix json --function-prefix xrtJson --constant-prefix XJSON_ --type-prefix xjson
          python tools/build.py --compiler gcc --suite json_read,xlon_read,memory_stats --no-examples --cflag=-O2 --cflag=-fsanitize=address,undefined --cflag=-fno-omit-frame-pointer --ldflag=-fsanitize=address,undefined
      - name: Modules, single header, example and trimming
        run: |
          python tools/build.py --compiler gcc --manifest extlibs/${{ matrix.product }}/config/modules.json --suite ${{ matrix.product }}_tests --cflag=-O2
          python tools/build.py --compiler gcc --manifest extlibs/${{ matrix.product }}/config/modules.json --suite ${{ matrix.examples }} --no-single --cflag=-O2
          python tools/build.py --compiler gcc --manifest extlibs/${{ matrix.product }}/config/modules.json --suite ${{ matrix.product }} --trim-only
      - name: Restart catch-up example
        if: matrix.product == 'xcron'
        run: >-
          python extlibs/xcron/tests/interop/run_restart_catchup.py
          out/gcc/native/xcron_examples/examples_restart_catchup_main
          out/service-extensions/xcron-restart-catchup-linux.json
      - name: Independent stdio subprocess peer
        if: matrix.product == 'xrpc'
        run: |
          python extlibs/xrpc/tests/interop/run_stdio.py out/gcc/native/xrpc_examples/examples_stdio_main out/service-extensions/xrpc-stdio-linux.json
      - name: Independent TCP peer and APP executor
        if: matrix.product == 'xrpc'
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Werror -fPIC -shared extlibs/xrpc/tests/interop/tcp_native_observer.c -o out/xrpc-observer.so &&
          XRPC_TCP_OBSERVER_NATIVE=out/xrpc-observer.so python extlibs/xrpc/tests/interop/test_tcp_observer.py &&
          python extlibs/xrpc/tests/interop/run_tcp_worker.py out/gcc/native/xrpc_examples/examples_tcp_worker_main out/service-extensions/xrpc-tcp-worker-linux.json
      - name: Address and undefined behavior sanitizers
        if: matrix.product != 'xmqtt'
        run: >-
          python tools/build.py --compiler gcc --manifest extlibs/${{ matrix.product }}/config/modules.json
          --suite ${{ matrix.product }}_tests --no-examples --cflag=-O2
          --cflag=-fsanitize=address,undefined --cflag=-fno-omit-frame-pointer
          --ldflag=-fsanitize=address,undefined
      - name: Check isolated MQTT codec and broker size closures
        if: matrix.product == 'xmqtt'
        run: >-
          python tools/measure_size.py --compiler gcc
          --config extlibs/xmqtt/config/size_profiles.json --profiles xmqtt_codec311,xmqtt_server --kind single
          --report out/service-extensions/size-xmqtt-closures-linux.json
      - name: Check calendar dependency boundary
        if: matrix.product == 'xcron'
        run: >-
          python tools/measure_size.py --compiler gcc
          --config extlibs/xcron/config/size_profiles.json --profiles xcron_calendar --kind single
          --report out/service-extensions/size-xcron-calendar-linux.json
      - name: Check Redis dependency boundaries
        if: matrix.product == 'xredis'
        run: >-
          python tools/measure_size.py --compiler gcc
          --config extlibs/xredis/config/size_profiles.json --profiles xredis_reply,xredis_client,xredis_dial,xredis_tls --kind single
          --report out/service-extensions/size-xredis-runtime-linux.json
      - name: Verify static and relocated shared package consumers
        shell: bash
        env:
          PRODUCT: ${{ matrix.product }}
          EXAMPLES: ${{ matrix.examples }}
        run: |
          suites=("$PRODUCT")
          if [[ "$PRODUCT" == xmqtt ]]; then
            suites+=("$EXAMPLES")
          fi
          for suite in "${suites[@]}"; do
            python tools/package.py --compiler gcc --manifest "extlibs/$PRODUCT/config/modules.json" --suite "$suite" --kind static --verify
            python tools/package.py --compiler gcc --manifest "extlibs/$PRODUCT/config/modules.json" --suite "$suite" --kind shared --verify
            (
              package="release/gnu/native/$suite/shared"
              relocated="$(mktemp -d "$RUNNER_TEMP/$suite sdk.XXXXXX")"
              trap 'rm -f -- "$relocated/lib$PRODUCT.so" "$relocated/libxrt.so" "$relocated/test_package_$PRODUCT"; rmdir -- "$relocated"' EXIT
              relocated="$(realpath "$relocated")"
              cp -- "$package/lib$PRODUCT.so" "$package/libxrt.so" "$package/test_package_$PRODUCT" "$relocated/"
              dependencies="$(env -u LD_LIBRARY_PATH -u LD_PRELOAD -u LD_AUDIT ldd "$relocated/lib$PRODUCT.so")"
              printf '%s\n' "$dependencies"
              grep -F "libxrt.so => $relocated/libxrt.so " <<< "$dependencies"
              env -u LD_LIBRARY_PATH -u LD_PRELOAD -u LD_AUDIT "$relocated/test_package_$PRODUCT"
            )
          done
      - name: Optional MQTT TCP server packages and independent peer
        if: matrix.product == 'xmqtt'
        run: |
          python tools/build.py --compiler gcc --manifest extlibs/xmqtt/config/modules.json --suite xmqtt_server --trim-only
          python tools/package.py --compiler gcc --manifest extlibs/xmqtt/config/modules.json --suite xmqtt_server --kind static --verify
          python tools/package.py --compiler gcc --manifest extlibs/xmqtt/config/modules.json --suite xmqtt_server --kind shared --verify
          python extlibs/xmqtt/tests/interop/run_server_handshake.py out/gcc/native/xmqtt_examples/examples_server_main out/service-extensions/xmqtt-broker-linux.json &&
          python extlibs/xmqtt/tests/interop/run_server_handshake.py out/gcc/native/xmqtt_examples/examples_server_main out/service-extensions/xmqtt-broker-pressure-linux.json --pressure-clients 64
      - name: MQTT mixed load and separate broker termination
        if: matrix.product == 'xmqtt'
        shell: bash
        run: |
          evidence=out/service-extensions/xmqtt-mixed
          python -B tools/test_service_mixed.py
          python -B tools/build_service_mixed.py xmqtt --output "$evidence/mixed"
          python -B extlibs/xmqtt/tests/interop/run_mqtt_mixed.py \
            --binary "$evidence/mixed" --seconds 30 --pause-ms 3 --report "$evidence/mixed.json"
          python -B tools/check_service_mixed.py xmqtt --binary "$evidence/mixed" \
            --report "$evidence/mixed.json" > "$evidence/audit.json"
          fault_status=0
          python -B extlibs/xmqtt/tests/interop/run_mqtt_mixed.py \
            --binary "$evidence/mixed" --seconds 20 --pause-ms 3 --kill-broker-after 5 \
            --report "$evidence/broker-terminated.json" || fault_status=$?
          test "$fault_status" -eq 1
          python -B - "$evidence/broker-terminated.json" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          fault = report["fault"]
          assert report["status"] == "failed" and report["native_72h"] is False
          assert fault["event"] == "broker process killed" and fault["verified_rounds"] > 0 and fault["broker_exit"] != 0
          PY
      - name: MQTT authentication and expiry across checkpoint transports
        if: matrix.product == 'xmqtt'
        shell: bash
        run: |
          tls_dir="$(mktemp -d "$RUNNER_TEMP/xmqtt-auth.XXXXXX")"
          trap 'rm -f -- "$tls_dir"/{certificate.pem,certificate.der,key.pem,key.der}; rmdir -- "$tls_dir"' EXIT
          openssl req -x509 -newkey rsa:2048 -sha256 -noenc -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost -keyout "$tls_dir/key.pem" -out "$tls_dir/certificate.pem"
          openssl x509 -in "$tls_dir/certificate.pem" -outform DER -out "$tls_dir/certificate.der"
          openssl pkey -in "$tls_dir/key.pem" -outform DER -out "$tls_dir/key.der"
          python extlibs/xmqtt/tests/interop/run_server_auth.py \
            out/gcc/native/xmqtt_examples/examples_server_auth "$tls_dir" \
            --checkpoint out/gcc/native/xmqtt_examples/examples_server_checkpoint --checkpoint-transports \
            > out/service-extensions/xmqtt-auth-checkpoint-linux.json
          python extlibs/xmqtt/tests/interop/run_server_checkpoint_transports.py \
            out/gcc/native/xmqtt_examples/examples_server_checkpoint "$tls_dir" \
            out/service-extensions/xmqtt-expiry-transports-linux.json --expiry-only
      - name: MQTT checkpoint writer quota
        if: matrix.product == 'xmqtt'
        run: >-
          python extlibs/xmqtt/tests/interop/run_server_checkpoint.py
          out/gcc/native/xmqtt_examples/examples_server_checkpoint --full-writer
          > out/service-extensions/xmqtt-checkpoint-writer-linux.json
      - name: MQTT durable first-send expiry
        if: matrix.product == 'xmqtt'
        run: >-
          python extlibs/xmqtt/tests/interop/run_server_checkpoint.py
          out/gcc/native/xmqtt_examples/examples_server_checkpoint --outgoing-expiry
          > out/service-extensions/xmqtt-outgoing-expiry-linux.json
      - name: MQTT legacy delivery migration into the APP inbox
        if: matrix.product == 'xmqtt'
        run: >-
          python extlibs/xmqtt/tests/interop/run_inbox_migration.py
          out/gcc/native/xmqtt_examples/examples_store_inbox_main
          > out/service-extensions/xmqtt-inbox-migration-linux.json
      - name: Optional xcron scheduler package and dependencies
        if: matrix.product == 'xcron'
        run: |
          python tools/build.py --compiler gcc --manifest extlibs/xcron/config/modules.json --suite xcron_scheduler --trim-only
          python tools/package.py --compiler gcc --manifest extlibs/xcron/config/modules.json --suite xcron_scheduler --kind static --verify
          python tools/package.py --compiler gcc --manifest extlibs/xcron/config/modules.json --suite xcron_scheduler --kind shared --verify
      - name: Workload smoke only
        if: matrix.product == 'xcron' || matrix.product == 'xrpc'
        run: >-
          python tools/measure_performance.py --config extlibs/${{ matrix.product }}/config/performance_profiles.json
          --smoke --repeats 1 --report out/service-extensions/performance-${{ matrix.product }}-linux-smoke.json
      - name: Fixed-arrival TCP latency samples
        if: matrix.product == 'xrpc'
        shell: bash
        run: |
          python -B extlibs/xrpc/tests/interop/run_tcp_worker.py \
            out/gcc/native/xrpc_examples/examples_tcp_worker_main out/service-extensions/xrpc-tcp-latency-linux.json \
            --saturation --auto-affinity --stagger-arrivals --connections 8 --workers 2 --window-batches 16 \
            --calls 8000 --rates 4000,8000 --repeats 5 \
            --observer-native out/xrpc-observer.so --raw-dir out/service-extensions/xrpc-tcp-latency-linux
      - name: Preserve workload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: service-extensions-${{ matrix.product }}-linux-smoke
          path: |
            out/service-extensions/*.json
            out/service-extensions/xrpc-tcp-latency-linux/*.jsonl.gz
            out/gcc/native/xrpc_examples/examples_tcp_worker_main
            out/xrpc-observer.so
            out/service-extensions/xmqtt-mixed/mixed
            out/service-extensions/xmqtt-mixed/*.json
            out/service-extensions/xmqtt-mixed/*.jsonl
            out/service-extensions/xmqtt-mixed/*.stderr
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: xredis
            examples: xredis_examples
          - product: xcron
            examples: xcron_examples
          - product: xrpc
            examples: xrpc_examples
          - product: xmqtt
            examples: xmqtt_examples
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Check assets before any generator can repair them
        run: |
          python tools/check_release_maturity.py --manifest extlibs/${{ matrix.product }}/config/modules.json
          python tools/generate_extension_features.py extlibs/${{ matrix.product }}/config/modules.json --check
          python tools/amalgamate.py --manifest extlibs/${{ matrix.product }}/config/modules.json --check
          python tools/generate_api_reference.py --manifest extlibs/${{ matrix.product }}/config/modules.json --check
          python tools/check_api_docs.py --manifest extlibs/${{ matrix.product }}/config/modules.json
      - name: Build asset and public API inventory regression
        if: matrix.product == 'xredis'
        run: python -m unittest tools.test_build.AggregateAssetTest tools.test_api_docs tools.test_api_reference tools.test_extension_layout
      - name: Shared JSON scanner and reader regression
        if: matrix.product == 'xredis'
        run: |
          python tools/check_api_docs.py --module-prefix json --function-prefix xrtJson --constant-prefix XJSON_ --type-prefix xjson
          python tools/build.py --compiler gcc --suite json_read,xlon_read,memory_stats --no-examples --cflag=-O2
      - name: Modules, single header, example and trimming
        run: |
          python tools/build.py --compiler gcc --manifest extlibs/${{ matrix.product }}/config/modules.json --suite ${{ matrix.product }}_tests --cflag=-O2
          python tools/build.py --compiler gcc --manifest extlibs/${{ matrix.product }}/config/modules.json --suite ${{ matrix.examples }} --no-single --cflag=-O2
          python tools/build.py --compiler gcc --manifest extlibs/${{ matrix.product }}/config/modules.json --suite ${{ matrix.product }} --trim-only
      - name: Restart catch-up example
        if: matrix.product == 'xcron'
        run: >-
          python extlibs/xcron/tests/interop/run_restart_catchup.py
          out/gcc/native/xcron_examples/examples_restart_catchup_main.exe
          out/service-extensions/xcron-restart-catchup-windows.json
      - name: Independent stdio subprocess peer
        if: matrix.product == 'xrpc'
        run: |
          python extlibs/xrpc/tests/interop/run_stdio.py out/gcc/native/xrpc_examples/examples_stdio_main.exe out/service-extensions/xrpc-stdio-windows.json
      - name: Independent TCP peer and APP executor
        if: matrix.product == 'xrpc'
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Werror -shared extlibs/xrpc/tests/interop/tcp_native_observer.c -o out/xrpc-observer.dll -lws2_32 &&
          XRPC_TCP_OBSERVER_NATIVE=out/xrpc-observer.dll python extlibs/xrpc/tests/interop/test_tcp_observer.py &&
          python extlibs/xrpc/tests/interop/run_tcp_worker.py out/gcc/native/xrpc_examples/examples_tcp_worker_main.exe out/service-extensions/xrpc-tcp-worker-windows.json
      - name: Check isolated MQTT codec and broker size closures
        if: matrix.product == 'xmqtt'
        run: >-
          python tools/measure_size.py --compiler gcc
          --config extlibs/xmqtt/config/size_profiles.json --profiles xmqtt_codec311,xmqtt_server --kind single
          --report out/service-extensions/size-xmqtt-closures-windows.json
      - name: Check calendar dependency boundary
        if: matrix.product == 'xcron'
        run: >-
          python tools/measure_size.py --compiler gcc
          --config extlibs/xcron/config/size_profiles.json --profiles xcron_calendar --kind single
          --report out/service-extensions/size-xcron-calendar-windows.json
      - name: Check Redis dependency boundaries
        if: matrix.product == 'xredis'
        run: >-
          python tools/measure_size.py --compiler gcc
          --config extlibs/xredis/config/size_profiles.json --profiles xredis_reply,xredis_client,xredis_dial,xredis_tls --kind single
          --report out/service-extensions/size-xredis-runtime-windows.json
      - name: Independent static and shared consumers
        run: |
          python tools/package.py --compiler gcc --manifest extlibs/${{ matrix.product }}/config/modules.json --suite ${{ matrix.product }} --kind static --verify
          python tools/package.py --compiler gcc --manifest extlibs/${{ matrix.product }}/config/modules.json --suite ${{ matrix.product }} --kind shared --verify
      - name: Optional MQTT TCP server packages and independent peer
        if: matrix.product == 'xmqtt'
        run: |
          python tools/build.py --compiler gcc --manifest extlibs/xmqtt/config/modules.json --suite xmqtt_server --trim-only
          python tools/package.py --compiler gcc --manifest extlibs/xmqtt/config/modules.json --suite xmqtt_server --kind static --verify
          python tools/package.py --compiler gcc --manifest extlibs/xmqtt/config/modules.json --suite xmqtt_server --kind shared --verify
          python extlibs/xmqtt/tests/interop/run_server_handshake.py out/gcc/native/xmqtt_examples/examples_server_main.exe out/service-extensions/xmqtt-broker-windows.json &&
          python extlibs/xmqtt/tests/interop/run_server_handshake.py out/gcc/native/xmqtt_examples/examples_server_main.exe out/service-extensions/xmqtt-broker-pressure-windows.json --pressure-clients 64
      - name: Required MQTT authentication across checkpoint restart
        if: matrix.product == 'xmqtt'
        run: >-
          python extlibs/xmqtt/tests/interop/run_server_auth.py
          out/gcc/native/xmqtt_examples/examples_server_auth.exe
          --checkpoint out/gcc/native/xmqtt_examples/examples_server_checkpoint.exe
          > out/service-extensions/xmqtt-auth-checkpoint-windows.json
      - name: MQTT durable session expiry across checkpoint transports
        if: matrix.product == 'xmqtt'
        run: |
          pacman --noconfirm --needed -S mingw-w64-ucrt-x86_64-openssl
          tls_dir="$(mktemp -d)"
          trap 'rm -f -- "$tls_dir"/{certificate.pem,certificate.der,key.pem,key.der}; rmdir -- "$tls_dir"' EXIT
          MSYS2_ARG_CONV_EXCL='/CN=' openssl req -x509 -newkey rsa:2048 -sha256 -noenc -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost -keyout "$tls_dir/key.pem" -out "$tls_dir/certificate.pem"
          openssl x509 -in "$tls_dir/certificate.pem" -outform DER -out "$tls_dir/certificate.der"
          openssl pkey -in "$tls_dir/key.pem" -outform DER -out "$tls_dir/key.der"
          python extlibs/xmqtt/tests/interop/run_server_checkpoint_transports.py \
            out/gcc/native/xmqtt_examples/examples_server_checkpoint.exe "$tls_dir" \
            out/service-extensions/xmqtt-expiry-transports-windows.json --expiry-only
      - name: MQTT checkpoint writer quota
        if: matrix.product == 'xmqtt'
        run: >-
          python extlibs/xmqtt/tests/interop/run_server_checkpoint.py
          out/gcc/native/xmqtt_examples/examples_server_checkpoint.exe --full-writer
          > out/service-extensions/xmqtt-checkpoint-writer-windows.json
      - name: MQTT durable first-send expiry
        if: matrix.product == 'xmqtt'
        run: >-
          python extlibs/xmqtt/tests/interop/run_server_checkpoint.py
          out/gcc/native/xmqtt_examples/examples_server_checkpoint.exe --outgoing-expiry
          > out/service-extensions/xmqtt-outgoing-expiry-windows.json
      - name: MQTT legacy delivery migration into the APP inbox
        if: matrix.product == 'xmqtt'
        run: >-
          python extlibs/xmqtt/tests/interop/run_inbox_migration.py
          out/gcc/native/xmqtt_examples/examples_store_inbox_main.exe
          > out/service-extensions/xmqtt-inbox-migration-windows.json
      - name: Optional xcron scheduler package and dependencies
        if: matrix.product == 'xcron'
        run: |
          python tools/build.py --compiler gcc --manifest extlibs/xcron/config/modules.json --suite xcron_scheduler --trim-only
          python tools/package.py --compiler gcc --manifest extlibs/xcron/config/modules.json --suite xcron_scheduler --kind static --verify
          python tools/package.py --compiler gcc --manifest extlibs/xcron/config/modules.json --suite xcron_scheduler --kind shared --verify
      - name: Workload smoke only
        if: matrix.product == 'xcron' || matrix.product == 'xrpc'
        run: >-
          python tools/measure_performance.py --config extlibs/${{ matrix.product }}/config/performance_profiles.json
          --smoke --repeats 1 --report out/service-extensions/performance-${{ matrix.product }}-windows-smoke.json
      - name: Fixed-arrival TCP latency samples
        if: matrix.product == 'xrpc'
        run: |
          python -B extlibs/xrpc/tests/interop/run_tcp_worker.py \
            out/gcc/native/xrpc_examples/examples_tcp_worker_main.exe out/service-extensions/xrpc-tcp-latency-windows.json \
            --saturation --auto-affinity --stagger-arrivals --connections 8 --workers 2 --window-batches 16 \
            --calls 8000 --rates 4000,8000 --repeats 5 \
            --observer-native out/xrpc-observer.dll --raw-dir out/service-extensions/xrpc-tcp-latency-windows
      - name: Preserve workload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: service-extensions-${{ matrix.product }}-windows-smoke
          path: |
            out/service-extensions/*.json
            out/service-extensions/xrpc-tcp-latency-windows/*.jsonl.gz
            out/gcc/native/xrpc_examples/examples_tcp_worker_main.exe
            out/xrpc-observer.dll
          if-no-files-found: warn

  xmqtt-linux-sanitizers:
    name: MQTT sanitizers (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Address and undefined behavior sanitizers
        run: >-
          python -u tools/build.py --compiler gcc --manifest extlibs/xmqtt/config/modules.json
          --suite xmqtt_tests --no-examples --jobs 2 --cflag=-O2
          --cflag=-fsanitize=address,undefined --cflag=-fno-omit-frame-pointer
          --ldflag=-fsanitize=address,undefined

  workload-smoke:
    name: Workload smoke (${{ matrix.product }}, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        product: [xredis, xmqtt]
        runner: [ubuntu-latest, windows-latest]
        include:
          - runner: ubuntu-latest
            platform: linux
          - runner: windows-latest
            platform: windows
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        if: matrix.platform == 'windows'
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Install Redis TLS peer dependency
        if: matrix.product == 'xredis'
        run: python -m pip install --disable-pip-version-check cryptography==50.0.0
      - name: Linux workload smoke
        if: matrix.platform == 'linux'
        shell: bash
        run: >-
          python tools/measure_performance.py --config extlibs/${{ matrix.product }}/config/performance_profiles.json
          --smoke --repeats 1 --report out/service-extensions/performance-${{ matrix.product }}-linux-smoke.json
      - name: Windows workload smoke
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: >-
          python tools/measure_performance.py --config extlibs/${{ matrix.product }}/config/performance_profiles.json
          --smoke --repeats 1 --report out/service-extensions/performance-${{ matrix.product }}-${{ matrix.platform }}-smoke.json
      - name: Preserve workload smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: service-extensions-${{ matrix.product }}-${{ matrix.platform }}-workload-smoke
          path: out/service-extensions/performance-${{ matrix.product }}-${{ matrix.platform }}-smoke.json
          if-no-files-found: warn

  xcron-linux-cohorts:
    if: github.event_name == 'workflow_dispatch' && inputs.xcron_cohorts
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Measure scheduler and direct-waiter cohorts
        shell: bash
        run: |
          evidence=out/service-extensions/xcron-linux-cohorts
          mkdir -p "$evidence"
          cpu=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          git rev-parse HEAD > "$evidence/revision.txt"
          lscpu > "$evidence/cpu.txt"
          XBENCH_PIN_CPU="$cpu" python -B tools/measure_performance.py --compiler gcc \
            --config extlibs/xcron/config/performance_profiles.json --profiles xcron_scheduler_cohort \
            --smoke --warmups 0 --repeats 1 --report "$evidence/build.json"
          cp out/performance/gnu/native/xcron/xcron_cohort_1024_wait "$evidence/cohort"
          runner=extlibs/xcron/bench/run_scheduler_cohorts.py
          sha256sum "$evidence/cohort" "$runner" > "$evidence/sha256.txt"
          python -B "$runner" "$evidence/cohort" --cpu "$cpu" --waves 256 --repeats 5 \
            --report "$evidence/latency.jsonl"
      - name: Attribute scheduler and direct-waiter latency
        shell: bash
        run: |
          evidence=out/service-extensions/xcron-linux-cohorts
          cpu=$(python -c 'import os; print(min(os.sched_getaffinity(0)))')
          gcc --version > "$evidence/wait-phase-compiler.txt"
          gcc -O2 -std=c11 -Wall -Wextra -Werror -I. -Iinclude -Iextlibs/xcron/include -pthread \
            extlibs/xcron/bench/bench_scheduler_wait_phase.c -o "$evidence/cohort-phase" -lm
          sha256sum "$evidence/cohort-phase" >> "$evidence/sha256.txt"
          python -B extlibs/xcron/bench/run_scheduler_cohorts.py "$evidence/cohort-phase" \
            --cpu "$cpu" --waves 64 --repeats 2 --require-wait-phases \
            --report "$evidence/wait-phases.jsonl"
      - name: Preserve scheduler latency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xcron-linux-cohorts
          path: out/service-extensions/xcron-linux-cohorts/
          if-no-files-found: warn

  redis-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REDIS_VERSION: '8.0.5'
      REDIS_SHA256: 012bca956fc7151abc2281950e69768ee9c53ce4b36588772041675bc95fd313
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build pinned Redis with TLS
        shell: bash
        run: |
          if [[ ! -r /usr/include/openssl/ssl.h ]]; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y libssl-dev
          fi
          archive="$RUNNER_TEMP/redis-$REDIS_VERSION.tar.gz"
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            "https://download.redis.io/releases/redis-$REDIS_VERSION.tar.gz" --output "$archive"
          printf '%s  %s\n' "$REDIS_SHA256" "$archive" | sha256sum --check
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/redis-$REDIS_VERSION" -j2 BUILD_TLS=yes MALLOC=libc OPTIMIZATION=-O2 redis-server
          "$RUNNER_TEMP/redis-$REDIS_VERSION/src/redis-server" --version
      - name: Verify Redis process replacement and interrupted pipeline
        shell: bash
        env:
          REDIS_REPORT_DIR: out/service-extensions/redis-restart
        run: |
          evidence="$REDIS_REPORT_DIR"
          mkdir -p "$evidence"
          gcc -std=gnu11 -O2 -Wall -Wextra -Werror -D_GNU_SOURCE \
            -DXREDIS_MODULE_XREDIS_POOL_SHARED_CONNECT -DXREDIS_MODULE_XREDIS_TRACKING \
            -DXREDIS_MODULE_XREDIS_SUBSCRIBER_NOTIFY -DXREDIS_MODULE_XREDIS_SUBSCRIPTION_SESSION \
            -DXREDIS_MODULE_XREDIS_TLS -DXRT_IMPLEMENTATION -DXREDIS_IMPLEMENTATION \
            -Iinclude -Iextlibs/xredis/include -include xredis/features.h \
            -include ./single/xrt.h -include ./single/extlibs/xredis.h \
            extlibs/xredis/tests/interop/redis_restart.c -o "$evidence/probe" -pthread -lm
          peer="$RUNNER_TEMP/redis-$REDIS_VERSION/src/redis-server"
          python -B extlibs/xredis/tests/interop/run_redis_restart.py \
            --server "$peer" --client "$evidence/probe" --report "$evidence/plain.json"
          for bytes in 0 1 2 3 4; do
            python -B extlibs/xredis/tests/interop/run_redis_restart.py \
              --server "$peer" --client "$evidence/probe" --report "$evidence/lost-reply-$bytes.json" \
              --lost-reply --reply-bytes "$bytes"
            python -B extlibs/xredis/tests/interop/run_redis_restart.py \
              --server "$peer" --client "$evidence/probe" --report "$evidence/tls-lost-reply-$bytes.json" \
              --tls --lost-reply --reply-bytes "$bytes"
          done
          python -B extlibs/xredis/tests/interop/run_redis_restart.py \
            --server "$peer" --client "$evidence/probe" --report "$evidence/tls-edited.json" \
            --tls --edit-subscriptions
      - name: Redis client mixed load with pinned native peer
        shell: bash
        run: |
          evidence=out/service-extensions/redis-mixed
          python -B tools/build_service_mixed.py xredis --output "$evidence/mixed"
          peer="$RUNNER_TEMP/redis-$REDIS_VERSION/src/redis-server"
          python -B extlibs/xredis/tests/interop/run_redis_mixed.py \
            --server "$peer" --client "$evidence/mixed" --seconds 30 --pause-ms 3 \
            --report "$evidence/mixed.json"
          python -B tools/check_service_mixed.py xredis --binary "$evidence/mixed" \
            --report "$evidence/mixed.json" > "$evidence/audit.json"
      - name: Preserve Redis process restart and mixed-load evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xredis-process-restart-linux
          path: |
            out/service-extensions/redis-restart/*.json
            out/service-extensions/redis-restart/*.log
            out/service-extensions/redis-mixed/mixed
            out/service-extensions/redis-mixed/*.json
            out/service-extensions/redis-mixed/*.jsonl
            out/service-extensions/redis-mixed/*.log
            out/service-extensions/redis-mixed/*.stderr
          if-no-files-found: warn
      - name: Verify fixed Sentinel seed recovery and primary failover
        shell: bash
        env:
          REDIS_SENTINEL_REPORT_DIR: out/service-extensions/redis-sentinel
        run: |
          evidence="$REDIS_SENTINEL_REPORT_DIR"
          peer="$RUNNER_TEMP/redis-$REDIS_VERSION/src/redis-server"
          python -B extlibs/xredis/tests/interop/build_sentinel_probe.py --output "$evidence/probe"
          python -B extlibs/xredis/tests/interop/run_redis_sentinel_seeds.py \
            --server "$peer" --client "$evidence/probe" --report "$evidence/fixed-seeds.json" --role master
          python -B extlibs/xredis/tests/interop/run_redis_sentinel_pool.py \
            --server "$peer" --client "$evidence/probe" --report "$evidence/primary-failover.json" --case 1 3
      - name: Preserve Redis Sentinel recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xredis-sentinel-recovery-linux
          path: |
            out/service-extensions/redis-sentinel/**/*.json
            out/service-extensions/redis-sentinel/**/*.log
          if-no-files-found: warn
      - name: Compare native Linux Redis TCP and TLS with Hiredis
        if: github.event_name == 'workflow_dispatch' && inputs.xredis_hiredis
        shell: bash
        run: |
          evidence=out/service-extensions/xredis-hiredis-linux
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/revision.txt"
          lscpu > "$evidence/cpu.txt"
          LC_ALL=C lscpu -p=CPU,CORE,SOCKET > "$evidence/cpu-topology.csv"
          cpus=$(python -B tools/select_service_benchmark_cpus.py xredis "$evidence/cpu-topology.csv")
          read -r fixture_cpus cpu_profile <<< "$cpus"
          printf 'fixture_cpus=%s\nprofile=%s\n' "$fixture_cpus" "$cpu_profile" > "$evidence/cpu-placement.txt"
          hiredis_sha=25cee4500f359cf5cad3b51ed62059aadfc0939b05150c1f19c7e2829123631c
          archive="$RUNNER_TEMP/hiredis-1.3.0.tar.gz"
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            https://codeload.github.com/redis/hiredis/tar.gz/refs/tags/v1.3.0 --output "$archive"
          printf '%s  %s\n' "$hiredis_sha" "$archive" | sha256sum --check
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP"
          hiredis="$RUNNER_TEMP/hiredis-1.3.0"
          cmake -S "$hiredis" -B "$RUNNER_TEMP/hiredis-build" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_SHARED_LIBS=OFF -DDISABLE_TESTS=ON -DENABLE_SSL=OFF
          cmake --build "$RUNNER_TEMP/hiredis-build" --target hiredis -j2
          library="$RUNNER_TEMP/hiredis-build/libhiredis.a"
          peer="$RUNNER_TEMP/redis-$REDIS_VERSION/src/redis-server"
          gcc --version > "$evidence/compiler.txt"
          openssl version -a > "$evidence/openssl.txt"
          "$peer" --version > "$evidence/redis.txt"
          sha256sum "$archive" "$library" "$peer" "tools/select_service_benchmark_cpus.py" > "$evidence/sha256.txt"
          observer=extlibs/xredis/bench/bench_client_openloop.c
          flags=(-std=gnu11 -O2 -Wall -Wextra -Werror -D_GNU_SOURCE -DXRT_IMPLEMENTATION
            -Iinclude -Iextlibs/xredis/include -include xredis/features.h -include ./single/xrt.h)
          status=0
          for transport in tcp tls; do
            xredis_module=XREDIS_MODULE_XREDIS_CLIENT
            transport_flags=()
            reference_tls=()
            fixture_tls=()
            if [[ "$transport" == tls ]]; then
              xredis_module=XREDIS_MODULE_XREDIS_TLS
              transport_flags=(-DREDIS_OPENLOOP_EXTERNAL_TLS)
              gcc -std=gnu11 -O2 -I"$hiredis" -c "$hiredis/ssl.c" -o "$RUNNER_TEMP/hiredis-ssl.o"
              reference_tls=("$RUNNER_TEMP/hiredis-ssl.o" -lssl -lcrypto)
              fixture_tls=(--fixture-tls)
            fi
            gcc "${flags[@]}" "${transport_flags[@]}" -D"$xredis_module" -DXREDIS_IMPLEMENTATION \
              -include ./single/extlibs/xredis.h "$observer" -o "$evidence/xredis-$transport" -pthread -lm
            gcc "${flags[@]}" "${transport_flags[@]}" -DXREDIS_MODULE_XREDIS_CLIENT -DREDIS_OPENLOOP_HIREDIS \
              -I"$hiredis" "$observer" "$library" "${reference_tls[@]}" \
              -o "$evidence/hiredis-$transport" -pthread -lm
            python -B extlibs/xredis/bench/compare_hiredis.py \
              --xredis "$evidence/xredis-$transport" --hiredis "$evidence/hiredis-$transport" \
              --server "$peer" --fixture-cpus "$fixture_cpus" "${fixture_tls[@]}" \
              --mixed --connections 4 --rate 2000 --count 4000 --window 128 --payload 1024 --repeats 5 \
              --report "$evidence/$transport.json" --raw-dir "$evidence/$transport-raw" || status=1
          done
          exit "$status"
      - name: Preserve native Hiredis comparison evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.xredis_hiredis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xredis-hiredis-linux
          path: out/service-extensions/xredis-hiredis-linux/
          if-no-files-found: warn

  xmqtt-linux-comparison:
    if: github.event_name == 'workflow_dispatch' && inputs.xmqtt_comparison
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install MQTT reference build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libcjson-dev libssl-dev openssl
      - name: Compare MQTT 5 clients and brokers on native Linux
        shell: bash
        run: |
          evidence=out/service-extensions/xmqtt-linux-comparison
          mkdir -p "$evidence"
          git rev-parse HEAD > "$evidence/revision.txt"
          lscpu > "$evidence/cpu.txt"
          LC_ALL=C lscpu -p=CPU,CORE,SOCKET > "$evidence/cpu-topology.csv"
          cpus=$(python -B tools/select_service_benchmark_cpus.py xmqtt "$evidence/cpu-topology.csv")
          read -r broker_cpu load_cpus publisher_cpu cpu_profile <<< "$cpus"
          printf 'broker=%s\nclients=%s\npublisher=%s\nprofile=%s\n' \
            "$broker_cpu" "$load_cpus" "$publisher_cpu" "$cpu_profile" > "$evidence/cpu-placement.txt"
          mosquitto_archive="$RUNNER_TEMP/mosquitto-2.1.2.tar.gz"
          paho_archive="$RUNNER_TEMP/paho-1.3.15.tar.gz"
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            https://mosquitto.org/files/source/mosquitto-2.1.2.tar.gz --output "$mosquitto_archive"
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            https://codeload.github.com/eclipse-paho/paho.mqtt.c/tar.gz/refs/tags/v1.3.15 --output "$paho_archive"
          printf '%s  %s\n' \
            fd905380691ac65ea5a93779e8214941829e3d6e038d5edff9eac5fd74cbed02 "$mosquitto_archive" \
            60ce2cfdc146fcb81c621cb8b45874d2eb1d4693105d048f60e31b8f3468be90 "$paho_archive" | sha256sum --check
          tar --no-same-owner -xzf "$mosquitto_archive" -C "$RUNNER_TEMP"
          tar --no-same-owner -xzf "$paho_archive" -C "$RUNNER_TEMP"

          cmake -S "$RUNNER_TEMP/mosquitto-2.1.2" -B "$RUNNER_TEMP/mosquitto-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG" \
            -DWITH_TLS=ON -DWITH_WEBSOCKETS=OFF -DWITH_TESTS=OFF -DWITH_CLIENTS=OFF \
            -DWITH_APPS=OFF -DWITH_PLUGINS=OFF -DWITH_DOCS=OFF -DWITH_LTO=OFF -DWITH_HTTP_API=OFF
          cmake --build "$RUNNER_TEMP/mosquitto-build" --target mosquitto -j2
          cp "$RUNNER_TEMP/mosquitto-build/src/mosquitto" "$evidence/mosquitto"

          paho="$RUNNER_TEMP/paho.mqtt.c-1.3.15"
          cmake -S "$paho" -B "$RUNNER_TEMP/paho-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DPAHO_BUILD_SHARED=OFF -DPAHO_BUILD_STATIC=ON \
            -DPAHO_ENABLE_TESTING=OFF -DPAHO_ENABLE_CPACK=OFF -DPAHO_HIGH_PERFORMANCE=ON -DPAHO_WITH_SSL=ON
          cmake --build "$RUNNER_TEMP/paho-build" --target paho-mqtt3a-static paho-mqtt3as-static -j2
          paho_library="$RUNNER_TEMP/paho-build/src/libpaho-mqtt3a.a"
          paho_tls="$RUNNER_TEMP/paho-build/src/libpaho-mqtt3as.a"

          flags=(-std=gnu11 -D_GNU_SOURCE -O2 -Wall -Wextra -Werror -DXRT_IMPLEMENTATION -DXMQTT_IMPLEMENTATION
            -Iinclude -Iextlibs/xmqtt/include -include xmqtt/features.h -include ./single/xrt.h -include ./single/extlibs/xmqtt.h)
          bench=extlibs/xmqtt/bench
          gcc "${flags[@]}" -DXMQTT_MODULE_XMQTT_CLIENT "$bench/bench_client_reference.c" \
            -o "$evidence/xmqtt-publish" -pthread -lm
          gcc "${flags[@]}" -DXMQTT_MODULE_XMQTT_CLIENT -DXMQTT_BENCH_PAHO -DPAHO_MQTT_STATIC=1 \
            -I"$paho/src" "$bench/bench_client_reference.c" "$paho_library" -o "$evidence/paho-publish" -pthread -lrt -ldl -lm
          gcc "${flags[@]}" -DXMQTT_MODULE_XMQTT_SERVER extlibs/xmqtt/examples/server/main.c \
            -o "$evidence/xmqtt-broker" -pthread -lm
          gcc "${flags[@]}" -DXMQTT_MODULE_XMQTT_SERVER -DXRT_MODULE_MEMORY_STATS "$bench/bench_server.c" \
            -o "$evidence/broker-observer" -pthread -lm
          python -B "$bench/test_broker_observer.py" "$evidence/broker-observer"

          gcc "${flags[@]}" -DXMQTT_MODULE_XMQTT_SERVER_TLS -DXRT_MODULE_TLS_IDENTITY_RSA \
            extlibs/xmqtt/examples/server/tls.c -o "$evidence/xmqtt-broker-tls" -pthread -lm
          gcc "${flags[@]}" -DXMQTT_MODULE_XMQTT_SERVER -DXRT_MODULE_MEMORY_STATS -DXMQTT_BENCH_TLS \
            -DXRT_MODULE_TLS_CLIENT_VERIFY -DXRT_MODULE_TLS_STREAM_FUTURE -DXRT_MODULE_TLS_STREAM_RETIRE \
            -DXRT_MODULE_TLS_RECORD_AES -DXRT_MODULE_TLS_SCHEDULE_SHA256 -DXRT_MODULE_TLS_KEY_EXCHANGE_X25519 \
            "$bench/bench_server.c" -o "$evidence/broker-observer-tls" -pthread -lm

          receiver_flags=(-DXRT_MODULE_EVENT -DXMQTT_BENCH_RECEIVER_TLS)
          receiver="$bench/bench_client_receive_reference.c"
          gcc "${flags[@]}" "${receiver_flags[@]}" -DXMQTT_MODULE_XMQTT_CLIENT_TLS "$receiver" \
            -o "$evidence/xmqtt-receive-tls" -pthread -lm
          gcc "${flags[@]}" "${receiver_flags[@]}" -DXMQTT_MODULE_XMQTT_CLIENT -DXMQTT_BENCH_PAHO \
            -DPAHO_MQTT_STATIC=1 -I"$paho/src" "$receiver" "$paho_tls" \
            -o "$evidence/paho-receive-tls" -pthread -lrt -ldl -lssl -lcrypto -lm

          python -B tools/build.py --compiler gcc --target-platform linux \
            --manifest extlibs/xmqtt/config/modules.json --suite xmqtt_server_checkpoint_example \
            --no-single --no-run --cflag=-O2
          cp out/gcc/native-linux/xmqtt_server_checkpoint_example/examples_server_checkpoint "$evidence/xmqtt-checkpoint"

          gcc --version > "$evidence/compiler.txt"
          openssl version -a > "$evidence/openssl.txt"
          ldd "$evidence/mosquitto" > "$evidence/broker-dependencies.txt"
          ldd "$evidence/paho-receive-tls" > "$evidence/paho-tls-dependencies.txt"
          sha256sum "$mosquitto_archive" "$paho_archive" "$paho_library" "$paho_tls" "$evidence/mosquitto" \
            "$evidence/xmqtt-publish" "$evidence/paho-publish" "$evidence/xmqtt-broker" "$evidence/broker-observer" \
            "$evidence/xmqtt-broker-tls" "$evidence/broker-observer-tls" \
            "$evidence/xmqtt-receive-tls" "$evidence/paho-receive-tls" "$evidence/xmqtt-checkpoint" \
            "$bench/compare_broker.py" "$bench/bench_server.c" "$bench/test_broker_observer.py" \
            "$bench/compare_broker_restart.py" "$bench/compare_broker_connections.py" "tools/select_service_benchmark_cpus.py" > "$evidence/sha256.txt"
          status=0
          for qos in 1 2; do
            python -B "$bench/compare_client_reference.py" --broker "$evidence/mosquitto" \
              --xmqtt "$evidence/xmqtt-publish" --paho "$evidence/paho-publish" \
              --broker-cpu "$broker_cpu" --client-cpus "$load_cpus" --qos "$qos" \
              --window 16 --rate 1500 --count 3000 --repeats 5 --report "$evidence/publish-qos$qos.json" || status=1
          done
          broker_args=(--xmqtt "$evidence/xmqtt-broker" --mosquitto "$evidence/mosquitto"
            --observer "$evidence/broker-observer" --broker-cpu "$broker_cpu" --load-cpus "$load_cpus"
            --rounds 3000 --warmup 300 --repeats 5)
          python -B "$bench/compare_broker.py" "${broker_args[@]}" --qos 0 \
            --workload exact:1:3000 --workload wildcard:8:10000 --report "$evidence/broker-qos0.json" || status=1
          python -B "$bench/compare_broker.py" "${broker_args[@]}" --qos 2 --window 16 --subscriber-window 16 \
            --workload wildcard:8:3000 --workload shared:8:3000 --report "$evidence/broker-qos2.json" || status=1
          python -B "$bench/compare_broker_restart.py" --xmqtt "$evidence/xmqtt-checkpoint" --mosquitto "$evidence/mosquitto" \
            --broker-cpu "$broker_cpu" --load-cpu "${load_cpus%%,*}" --repeats 5 \
            --workload 1:32:1 --workload 1:32:2 --workload 8:128:1 --workload 8:128:2 \
            --report "$evidence/broker-restart.json" || status=1

          tls_dir=$(mktemp -d "$RUNNER_TEMP/xmqtt-comparison-tls.XXXXXX")
          trap 'rm -f -- "$tls_dir"/{ca.pem,ca.key,request.pem,certificate.pem,certificate.der,key.pem,key.der}; rmdir -- "$tls_dir"' EXIT
          (
            umask 077
            openssl req -x509 -newkey rsa:2048 -noenc -sha256 -days 1 -subj /CN=benchmark-CA \
              -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign' \
              -keyout "$tls_dir/ca.key" -out "$tls_dir/ca.pem"
            openssl req -new -newkey rsa:2048 -noenc -sha256 -subj /CN=localhost \
              -keyout "$tls_dir/key.pem" -out "$tls_dir/request.pem"
            openssl x509 -req -in "$tls_dir/request.pem" -CA "$tls_dir/ca.pem" -CAkey "$tls_dir/ca.key" \
              -set_serial 1 -days 1 -sha256 -out "$tls_dir/certificate.pem" \
              -extfile <(printf '%s\n' 'subjectAltName=DNS:localhost' 'extendedKeyUsage=serverAuth')
            openssl x509 -in "$tls_dir/certificate.pem" -outform DER -out "$tls_dir/certificate.der"
            openssl rsa -in "$tls_dir/key.pem" -traditional -outform DER -out "$tls_dir/key.der"
          )
          tls_args=(--xmqtt "$evidence/xmqtt-broker-tls" --mosquitto "$evidence/mosquitto"
            --observer "$evidence/broker-observer-tls" --broker-cpu "$broker_cpu" --load-cpus "$load_cpus"
            --tls-credentials "$tls_dir" --rounds 3000 --warmup 300 --repeats 5)
          for qos in 0 1 2; do
            python -B "$bench/compare_broker.py" "${tls_args[@]}" --qos "$qos" --window 16 \
              --workload exact:1:1000 --workload shared:8:2000 --report "$evidence/broker-tls-qos$qos.json" || status=1
          done
          receiver_args=(--xmqtt "$evidence/xmqtt-receive-tls" --paho "$evidence/paho-receive-tls"
            --broker "$evidence/mosquitto" --broker-cpu "$broker_cpu" --peer-cpu "$publisher_cpu"
            --client-cpus "$load_cpus" --tls-credentials "$tls_dir" --repeats 5)
          for workload in '1 1 1200 1800' '1 16 3000 4500' '2 1 1200 1200' '2 16 3000 1200'; do
            read -r qos window rate count <<< "$workload"
            python -B "$bench/compare_client_receivers.py" "${receiver_args[@]}" --qos "$qos" --window "$window" \
              --rate "$rate" --count "$count" --report "$evidence/receive-tls-qos$qos-w$window.json" || status=1
          done
          capacity_args=(--xmqtt "$evidence/xmqtt-broker" --mosquitto "$evidence/mosquitto"
            --broker-cpu "$broker_cpu" --load-cpu "${load_cpus%%,*}" --concurrency 32 --idle-seconds 2 --repeats 5)
          python -B "$bench/compare_broker_connections.py" "${capacity_args[@]}" \
            --clients 1 --clients 100 --clients 1000 --clients 8000 --clients 10000 \
            --report "$evidence/broker-connections.json" || status=1
          python -B "$bench/compare_broker_connections.py" "${capacity_args[@]}" --prepare-xmqtt-fds \
            --clients 1000 --clients 10000 --report "$evidence/broker-connections-prepared.json" || status=1
          exit "$status"
      - name: Preserve native MQTT comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xmqtt-linux-comparison
          path: out/service-extensions/xmqtt-linux-comparison/
          if-no-files-found: warn
